name = "whyapp-web"
main = "src/index.ts"
compatibility_date = "2024-12-01"

routes = [
  { pattern = "whyapp.us", custom_domain = true }
]

# Static assets (e.g. the C-LARS test site under /c-lars/). Assets are matched
# first; any non-asset path falls through to the Worker below.
[assets]
directory = "./public"
binding = "ASSETS"
# Default "auto-trailing-slash": maps /c-lars/ -> index.html and resolves
# .html links (302 to the extensionless URL, which then serves the file).

[[kv_namespaces]]
binding = "TRIGGER_RESULTS"
id = "97cd047727b64fb7a9f1faa83167abda"

# Trail family tracker: users, invites, activities
[[kv_namespaces]]
binding = "TRAIL"
id = "5549fe52a1644707971ecabbadf3842f"
