name = "whyapp-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain
routes = [
  { pattern = "api.whyapp.us", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "whyapp-db"
database_id = "ecd61511-6a57-492e-8fc3-00e4ee920350"
migrations_dir = "migrations"

# R2 bucket
[[r2_buckets]]
binding = "FILES"
bucket_name = "whyapp-files"

# Cron: pull raw Gmail + refresh iCal feeds every 10 minutes
[triggers]
crons = ["*/10 * * * *"]

# Secrets (set via `wrangler secret put <NAME>`):
# - GOOGLE_CLIENT_SECRET
# - OAUTH_ENCRYPTION_KEY  (32-byte base64, AES-GCM master key)
# - SESSION_JWT_SECRET
# - ANTHROPIC_API_KEY
