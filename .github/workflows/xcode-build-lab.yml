name: Lab iOS Xcode build + TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave blank to auto-increment from last TestFlight build)'
        required: false
        default: ''

concurrency:
  group: xcode-build-lab
  cancel-in-progress: false

jobs:
  build:
    name: Xcode build → TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_DIR: apps/lab-mobile
      BUNDLE_ID: us.whyapp.lab
      SCHEME: WHYLab
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (generate ios project)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ios --clean --no-install

      # --- Codesigning via manual provisioning ---
      - name: Install Apple certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PROFILE_PATH")")
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      # --- CocoaPods ---
      - name: Install Pods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install

      # --- Determine build number ---
      - name: Set build number
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUM="${{ inputs.build_number }}"
          else
            # Read current from Info.plist and increment
            CURRENT=$(defaults read "$(pwd)/ios/WHYLab/Info.plist" CFBundleVersion 2>/dev/null || echo "0")
            BUILD_NUM=$((CURRENT + 1))
          fi
          echo "BUILD_NUMBER=$BUILD_NUM" >> "$GITHUB_ENV"

          # Stamp it into the plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" \
            ios/WHYLab/Info.plist
          echo "Build number: $BUILD_NUM"

      # --- Build archive ---
      - name: Build & archive
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          xcodebuild archive \
            -workspace WHYLab.xcworkspace \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/WHYLab.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            -allowProvisioningUpdates \
            | xcbeautify || true

      # --- Export IPA ---
      - name: Create ExportOptions.plist
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>us.whyapp.lab</key>
              <string>${{ env.PROFILE_UUID }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/WHYLab.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      # --- Upload to TestFlight ---
      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          # Write the API key to a file
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_API_KEY" > \
            ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          xcrun notarytool --help > /dev/null 2>&1 || true

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/WHY Lab.ipa" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      # --- Cleanup ---
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/build.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/cert.p12 $RUNNER_TEMP/profile.mobileprovision
